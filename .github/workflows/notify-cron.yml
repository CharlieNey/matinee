name: Notify cron

# Backup push scheduler. The primary is Supabase Cron, every minute
# (supabase/scheduler/enable.sql); see docs/NOTIFICATIONS.md for why.
# Runs are idempotent, so this can run alongside it. GitHub disables
# scheduled workflows after 60 days without a commit (it did on
# 2026-09-15), delays them under load, and may drop them, which is why it
# is no longer the only caller.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate program windows and send due pushes
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "X-Matinee-Scheduler: github-actions" \
            "${{ secrets.APP_URL }}/api/notify/run"

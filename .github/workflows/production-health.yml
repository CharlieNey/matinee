name: Production health

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check catalog, database, rate limiter, push scheduler, and TKTS
        run: |
          # No -f: a 503 still carries the JSON that says what failed.
          curl -sS "${{ secrets.APP_URL }}/api/health" -o health.json
          jq -e '.ok == true' health.json
      - name: Show what failed
        if: failure()
        run: jq '{services, push, catalog}' health.json || cat health.json

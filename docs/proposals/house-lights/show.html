<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>House Lights · The Outsiders (style frame)</title>
<!-- Throwaway style frame for judging by eye. Not the build. Data as of 2026-11-20. -->
<link rel="stylesheet" href="frame.css">
<style>
  .pool { background: radial-gradient(250px 230px at 50% 210px, rgb(255 196 150 / .28), rgb(255 196 150 / .08) 55%, transparent 80%); }
  .beam::before { clip-path: polygon(48% 4%, 52% 4%, 90% 40%, 10% 40%); }
  .back { position: absolute; top: 62px; left: 16px; color: var(--text-2); font-size: 22px; }
  .poster {
    display: block; width: 168px; aspect-ratio: 1; margin: 20px auto 0; border-radius: 14px; object-fit: cover;
    outline: 1px solid rgb(246 232 213 / .28); outline-offset: 4px;
    box-shadow: 0 18px 40px rgb(0 0 0 / .6);
  }
  .cue { justify-content: center; margin-top: 22px; }
  .display { font-size: 52px; text-align: center; margin-top: 8px; }
  .facts { text-align: center; margin-top: 8px; font-size: 13.5px; color: var(--text-2); }
  .facts b { color: var(--ivory); }
  .cta {
    margin-top: 18px; height: 50px; border-radius: 999px; background: var(--crimson); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .list { margin-top: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 2px 16px; }
  .item { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .item .what { color: var(--text); font-size: 15px; }
  .item .when { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 7px; }
  .item .when .live { color: var(--ivory); font-weight: 700; }
  .g { width: 7px; height: 7px; border-radius: 50%; background: var(--gilt); box-shadow: 0 0 10px rgb(201 162 39 / .8); }
  .s { width: 6px; height: 6px; border-radius: 50%; background: #7f9a84; }
</style>
</head>
<body>
  <div class="stage beam"></div>
  <div class="stage pool"></div>
  <div class="stage legs"></div>
  <nav class="pipe" aria-hidden="true"><svg id="plot" data-lit="2"></svg></nav>
  <span class="back">←</span>

  <main class="content">
    <img class="poster" src="../../../public/posters/the-outsiders.jpg" alt="" style="object-position: 0% center">
    <p class="cue mono"><b>Q 1</b><span>Bernard B. Jacobs Theatre</span></p>
    <h1 class="display">The Outsiders</h1>
    <p class="facts">Broadway · Musical · face value <b>$89</b> · Telecharge</p>
    <div class="cta">Follow this show</div>

    <div class="row-head"><h2 class="eyebrow">Ways to save</h2><span>3 programs</span></div>
    <div class="list">
      <div class="item"><span class="what">Digital lottery · <span class="price">$49</span></span><span class="when"><span class="g"></span><span class="live">56 min</span> left</span></div>
      <div class="item"><span class="what">Rush · <span class="price">$45</span></span><span class="when"><span class="s"></span>Open now</span></div>
      <div class="item"><span class="what">Standing room · <span class="price">$39</span></span><span class="when">Sold-out shows</span></div>
    </div>
  </main>

  <nav class="tabbar" aria-hidden="true">
    <span class="on"><i></i>Discover</span><span><i></i>Log</span><span><i></i>Rush</span><span><i></i>Profile</span>
  </nav>
  <div class="stage grain"></div>
  <script src="pipe.js"></script>
</body>
</html>
